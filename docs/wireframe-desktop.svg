<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="4300" viewBox="0 0 1440 4300" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe desktop da Mercearia do Seu Zé</title>
  <desc id="desc">Estrutura vertical da futura página desktop, com cabeçalho, hero, atalhos, história, ofertas, produtos, localização, contato e rodapé.</desc>
  <defs>
    <pattern id="photo" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="#d9d8d3"/>
      <line x1="0" y1="0" x2="0" y2="28" stroke="#c2c1bb" stroke-width="2"/>
    </pattern>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif;fill:#2e2d2b}
      .serif{font-family:Georgia,'Times New Roman',serif;fill:#2e2d2b}
      .label{font-size:14px;font-weight:700;letter-spacing:1.5px}
      .body{font-size:18px}
      .small{font-size:14px;fill:#565553}
      .h1{font-size:68px;font-weight:500}
      .h2{font-size:44px;font-weight:500}
      .h3{font-size:24px;font-weight:700}
      .white{fill:#fff}
      .line{stroke:#888781;stroke-width:3;stroke-linecap:round}
      .thin{stroke:#aaa9a3;stroke-width:2;stroke-linecap:round}
      .outline{fill:none;stroke:#2e2d2b;stroke-width:2}
      .note{fill:#fff;stroke:#006f46;stroke-width:2}
      .noteText{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#006f46}
    </style>
  </defs>

  <rect width="1440" height="4300" fill="#f8f7f5"/>

  <!-- Header -->
  <rect width="1440" height="92" fill="#004e36"/>
  <text x="64" y="55" class="serif white h3">MERCEARIA DO SEU ZÉ</text>
  <text x="705" y="43" class="sans white small">Hoje: horário a confirmar</text>
  <rect x="1160" y="22" width="216" height="50" rx="3" fill="#fff"/>
  <text x="1268" y="53" text-anchor="middle" class="sans label" fill="#004e36">FALAR NO WHATSAPP</text>
  <rect y="92" width="1440" height="58" fill="#006f46"/>
  <g class="sans white label">
    <text x="64" y="128">INÍCIO</text>
    <text x="190" y="128">OFERTAS</text>
    <text x="330" y="128">PRODUTOS</text>
    <text x="492" y="128">NOSSA HISTÓRIA</text>
    <text x="705" y="128">VISITE</text>
  </g>

  <!-- Hero -->
  <rect y="150" width="1440" height="690" fill="url(#photo)"/>
  <text x="1120" y="780" class="sans small">FOTOGRAFIA REAL DA MERCEARIA OU ALIMENTOS</text>
  <rect x="64" y="245" width="590" height="490" fill="#fff"/>
  <text x="112" y="305" class="sans label" fill="#006f46">MERCEARIA DE BAIRRO EM CURITIBA</text>
  <text x="112" y="390" class="serif h1">
    <tspan x="112" dy="0">O frescor do</tspan>
    <tspan x="112" dy="78">bairro, pertinho</tspan>
    <tspan x="112" dy="78">de você.</tspan>
  </text>
  <line x1="112" y1="615" x2="560" y2="615" class="line"/>
  <line x1="112" y1="645" x2="490" y2="645" class="line"/>
  <rect x="112" y="678" width="158" height="50" rx="3" fill="#004e36"/>
  <text x="191" y="710" text-anchor="middle" class="sans white label">VER OFERTAS</text>
  <text x="310" y="710" class="sans label" fill="#006f46">COMO CHEGAR →</text>
  <g transform="translate(666 206)"><rect width="88" height="34" rx="17" class="note"/><text x="44" y="22" text-anchor="middle" class="noteText">A1 + A2</text></g>

  <!-- Quick links -->
  <rect y="840" width="1440" height="260" fill="#fff"/>
  <text x="64" y="900" class="sans label" fill="#006f46">ATALHOS ÚTEIS</text>
  <g transform="translate(64 930)">
    <rect width="402" height="116" fill="#faf5eb"/>
    <text x="24" y="66" class="sans h3" fill="#004e36">Ofertas da semana</text>
    <rect x="280" width="122" height="116" fill="url(#photo)"/>
  </g>
  <g transform="translate(519 930)">
    <rect width="402" height="116" fill="#faf5eb"/>
    <text x="24" y="66" class="sans h3" fill="#004e36">Produtos frescos</text>
    <rect x="280" width="122" height="116" fill="url(#photo)"/>
  </g>
  <g transform="translate(974 930)">
    <rect width="402" height="116" fill="#faf5eb"/>
    <text x="24" y="66" class="sans h3" fill="#004e36">Fale com o Seu Zé</text>
    <rect x="280" width="122" height="116" fill="url(#photo)"/>
  </g>

  <!-- Story -->
  <text x="64" y="1188" class="sans label" fill="#006f46">01 — NOSSA HISTÓRIA</text>
  <rect x="120" y="1240" width="650" height="580" fill="url(#photo)"/>
  <rect x="706" y="1380" width="614" height="470" fill="#faf5eb"/>
  <text x="760" y="1465" class="serif h2">
    <tspan x="760">Tradição que faz</tspan>
    <tspan x="760" dy="54">parte do bairro.</tspan>
  </text>
  <line x1="760" y1="1600" x2="1210" y2="1600" class="line"/>
  <line x1="760" y1="1632" x2="1160" y2="1632" class="line"/>
  <line x1="760" y1="1664" x2="1190" y2="1664" class="line"/>
  <line x1="760" y1="1696" x2="1090" y2="1696" class="line"/>
  <text x="760" y="1772" class="sans label" fill="#006f46">CONHEÇA A MERCEARIA →</text>
  <g transform="translate(1250 1320)"><rect width="80" height="34" rx="17" class="note"/><text x="40" y="22" text-anchor="middle" class="noteText">A3 + A4</text></g>

  <!-- Offers -->
  <rect y="1930" width="1440" height="780" fill="#fff"/>
  <text x="64" y="2000" class="sans label" fill="#006f46">02 — OFERTAS DA SEMANA</text>
  <text x="64" y="2070" class="serif h2">Oferta boa para a rotina.</text>
  <line x1="64" y1="2115" x2="590" y2="2115" class="line"/>
  <line x1="64" y1="2147" x2="500" y2="2147" class="line"/>
  <g transform="translate(64 2210)">
    <g>
      <rect width="292" height="260" fill="url(#photo)"/>
      <circle cx="255" cy="36" r="25" fill="#f4c542"/>
      <text x="0" y="304" class="sans h3">Produto 01</text>
      <text x="0" y="338" class="sans body">unidade / peso</text>
      <text x="0" y="388" class="sans h3" fill="#004e36">R$ 00,00</text>
    </g>
    <g transform="translate(340)">
      <rect width="292" height="260" fill="url(#photo)"/>
      <text x="0" y="304" class="sans h3">Produto 02</text>
      <text x="0" y="338" class="sans body">unidade / peso</text>
      <text x="0" y="388" class="sans h3" fill="#004e36">R$ 00,00</text>
    </g>
    <g transform="translate(680)">
      <rect width="292" height="260" fill="url(#photo)"/>
      <text x="0" y="304" class="sans h3">Produto 03</text>
      <text x="0" y="338" class="sans body">unidade / peso</text>
      <text x="0" y="388" class="sans h3" fill="#004e36">R$ 00,00</text>
    </g>
    <g transform="translate(1020)">
      <rect width="292" height="260" fill="url(#photo)"/>
      <text x="0" y="304" class="sans h3">Produto 04</text>
      <text x="0" y="338" class="sans body">unidade / peso</text>
      <text x="0" y="388" class="sans h3" fill="#004e36">R$ 00,00</text>
    </g>
  </g>
  <text x="64" y="2650" class="sans small">Validade e disponibilidade de estoque devem aparecer com dados reais.</text>
  <g transform="translate(1264 1980)"><rect width="76" height="34" rx="17" class="note"/><text x="38" y="22" text-anchor="middle" class="noteText">A4</text></g>

  <!-- Product editorial -->
  <text x="64" y="2800" class="sans label" fill="#006f46">03 — PRODUTOS E ATENDIMENTO</text>
  <rect x="120" y="2860" width="1200" height="560" fill="#faf5eb"/>
  <rect x="120" y="2860" width="670" height="560" fill="url(#photo)"/>
  <text x="850" y="2990" class="serif h2">
    <tspan x="850">Tudo para o</tspan>
    <tspan x="850" dy="54">seu dia a dia.</tspan>
  </text>
  <line x1="850" y1="3135" x2="1240" y2="3135" class="line"/>
  <line x1="850" y1="3167" x2="1200" y2="3167" class="line"/>
  <line x1="850" y1="3199" x2="1220" y2="3199" class="line"/>
  <text x="850" y="3280" class="sans label" fill="#006f46">VER O QUE VOCÊ ENCONTRA →</text>
  <g transform="translate(750 2808)"><rect width="86" height="34" rx="17" class="note"/><text x="43" y="22" text-anchor="middle" class="noteText">A3 + A5</text></g>

  <!-- Visit -->
  <rect y="3520" width="1440" height="520" fill="#004e36"/>
  <text x="64" y="3590" class="sans white label">04 — VISITE A MERCEARIA</text>
  <text x="120" y="3680" class="serif white h2">Pertinho de você.</text>
  <text x="120" y="3750" class="sans white h3">Endereço a confirmar</text>
  <line x1="120" y1="3795" x2="560" y2="3795" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="3827" x2="500" y2="3827" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="3895" class="sans white body">Segunda a sexta — horário</text>
  <text x="120" y="3930" class="sans white body">Sábado — horário</text>
  <text x="120" y="3965" class="sans white body">Domingo — horário</text>
  <rect x="120" y="3995" width="180" height="44" rx="3" fill="#fff"/>
  <text x="210" y="4023" text-anchor="middle" class="sans label" fill="#004e36">COMO CHEGAR</text>
  <rect x="720" y="3600" width="600" height="360" fill="url(#photo)" stroke="#fff" stroke-width="2"/>
  <text x="1020" y="3790" text-anchor="middle" class="sans h3">MAPA / LOCALIZAÇÃO</text>

  <!-- Footer -->
  <rect y="4040" width="1440" height="260" fill="#003c2a"/>
  <text x="64" y="4110" class="serif white h3">MERCEARIA DO SEU ZÉ</text>
  <text x="64" y="4150" class="sans white body">Contato e endereço confirmados</text>
  <g class="sans white label">
    <text x="650" y="4110">INÍCIO</text>
    <text x="650" y="4150">OFERTAS</text>
    <text x="830" y="4110">PRODUTOS</text>
    <text x="830" y="4150">VISITE</text>
    <text x="1080" y="4110">REDES SOCIAIS</text>
  </g>
  <line x1="64" y1="4220" x2="1376" y2="4220" stroke="#fff" stroke-opacity="0.35"/>
  <text x="64" y="4265" class="sans white small">© Mercearia do Seu Zé — direitos reservados</text>
</svg>

